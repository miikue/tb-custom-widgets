<div [formGroup]="configFormGroup">
  <tb-datasources
    [configMode]="basicMode"
    hideDataKeys
    formControlName="datasources">
  </tb-datasources>

  <tb-data-keys-panel
    panelTitle="Body"
    addKeyTitle="Přidat bod"
    keySettingsTitle="Nastavení bodu"
    removeKeyTitle="Odebrat bod"
    noKeysText="Nejsou nastavené žádné body"
    hideDataKeyColor
    [datasourceType]="datasource?.type"
    [deviceId]="datasource?.deviceId"
    [entityAliasId]="datasource?.entityAliasId"
    formControlName="dataKeys">
  </tb-data-keys-panel>

  <mat-form-field>
    <mat-label>Text ON</mat-label>
    <input matInput type="text" formControlName="textOn"/>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Text OFF</mat-label>
    <input matInput type="text" formControlName="textOff"/>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Bad text</mat-label>
    <input matInput type="text" formControlName="badText"/>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Bad color</mat-label>
    <input matInput type="color" formControlName="badColor"/>
  </mat-form-field>

  <tb-widget-actions-panel
    formControlName="actions">
  </tb-widget-actions-panel>
</div>
