<div class="iris-x" [ngStyle]="themeVars">
  <div class="iris-x__bg-glow"></div>

  <div #diagramRef class="iris-x__diagram">
    <svg class="iris-x__paths" [attr.viewBox]="'0 0 ' + diagramWidth + ' ' + diagramHeight" preserveAspectRatio="none" aria-hidden="true">
      <path id="path-fve-grid" class="flow flow--fve-grid" [attr.d]="fveToGridPath"></path>
      <path id="path-fve-home" class="flow flow--fve-home" [attr.d]="fveToHomePath"></path>
      <path id="path-grid-home" class="flow flow--grid-home" [attr.d]="gridToHomePath"></path>
      <path *ngIf="showMaric" id="path-fve-maric" class="flow flow--fve-maric" [attr.d]="fveToMaricPath"></path>

      <g class="flow-bubbles">
        <circle
          *ngFor="let bubble of flowBubbles; trackBy: trackByBubble"
          class="flow-bubble"
          [ngClass]="'flow-bubble--' + bubble.edge"
          [attr.r]="bubble.sizePx / 2"
        >
          <animateMotion
            [attr.dur]="bubble.durationSec + 's'"
            [attr.begin]="bubble.beginSec + 's'"
            repeatCount="indefinite"
            rotate="auto"
          >
            <mpath [attr.xlink:href]="'#path-' + bubble.edge"></mpath>
          </animateMotion>
          <animate
            attributeName="opacity"
            values="0;1;1;0"
            keyTimes="0;0.12;0.88;1"
            [attr.dur]="bubble.durationSec + 's'"
            [attr.begin]="bubble.beginSec + 's'"
            repeatCount="indefinite"
          ></animate>
        </circle>
      </g>
    </svg>

    <section class="energy-node energy-node--fve" aria-label="FVE" [style.left.px]="fveNodeLeft" [style.top.px]="fveNodeTop" [style.width.px]="nodeDiameterPx" [style.height.px]="nodeDiameterPx">
      <div class="energy-node__ring">
        <div class="energy-node__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M12 2.5V5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M12 19V21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M2.5 12H5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M19 12H21.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M5.3 5.3L7.1 7.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M16.9 16.9L18.7 18.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M16.9 7.1L18.7 5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M5.3 18.7L7.1 16.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </div>
        <div class="energy-node__value">{{ fveValueText }} {{ fveUnitText }}</div>
      </div>
      <div class="energy-node__label-block energy-node__label-block--top">
        <div class="energy-node__name">FVE</div>
      </div>
    </section>

    <section *ngIf="showMaric" class="energy-node energy-node--maric" aria-label="Mařič" [style.left.px]="maricNodeLeft" [style.top.px]="maricNodeTop" [style.width.px]="nodeDiameterPx" [style.height.px]="nodeDiameterPx">
      <div class="energy-node__ring">
        <div class="energy-node__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 6.5H17V9.5H7V6.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
            <path d="M7 14.5H17V17.5H7V14.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
            <path d="M10 9.5V14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            <path d="M14 9.5V14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
        </div>
        <div class="energy-node__value">{{ maricValueText }} {{ maricUnitText }}</div>
      </div>
      <div class="energy-node__label-block energy-node__label-block--top">
        <div class="energy-node__name">Mařič</div>
      </div>
    </section>

    <section class="energy-node energy-node--grid" aria-label="Distribuční síť" [style.left.px]="gridNodeLeft" [style.top.px]="gridNodeTop" [style.width.px]="nodeDiameterPx" [style.height.px]="nodeDiameterPx">
      <div class="energy-node__ring">
        <div class="energy-node__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.5 2.5L5.8 13.3H11L10.5 21.5L18.2 10.7H13L13.5 2.5Z" fill="currentColor"></path>
          </svg>
        </div>
        <div class="energy-node__value" [class.energy-node__value--export]="isGridExport">{{ gridValueText }} {{ gridUnitText }}</div>
      </div>
      <div class="energy-node__label-block energy-node__label-block--bottom">
        <div class="energy-node__name">Distribuční síť</div>
        <div class="energy-node__hint">{{ gridFlowText }}</div>
      </div>
    </section>

    <section class="energy-node energy-node--home" aria-label="Spotřeba" [style.left.px]="homeNodeLeft" [style.top.px]="homeNodeTop" [style.width.px]="nodeDiameterPx" [style.height.px]="nodeDiameterPx">
      <div class="energy-node__ring">
        <div class="energy-node__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 10.2L12 3.5L20 10.2V20.5H14.5V14.8H9.5V20.5H4V10.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="energy-node__value">{{ homeValueText }} {{ homeUnitText }}</div>
      </div>
      <div class="energy-node__label-block energy-node__label-block--bottom">
        <div class="energy-node__name">Spotřeba</div>
      </div>
    </section>
  </div>
</div>
