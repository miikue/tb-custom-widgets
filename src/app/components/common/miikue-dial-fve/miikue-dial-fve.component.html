<div class="widget-card">
  <div class="gauge-container">
      <svg viewBox="0 -15 200 160" preserveAspectRatio="xMidYMid meet" class="gauge-svg">
          <!-- Background Track (Semi-circle from 180deg to 360deg) -->
          <path d="M 20 100 A 80 80 0 0 1 180 100" class="bg-arc" />

          <!-- Active Arc (Production) -->
          <path d="M 20 100 A 80 80 0 0 1 180 100" 
                class="active-arc"
                stroke-dasharray="251" 
                [attr.stroke]="productionColor"
                [attr.stroke-dashoffset]="activeOffset" />
          
          <!-- Generated main ticks (dynamic) -->
          @for (tick of ticks; track trackByMainTick($index, tick)) {
          <g>
            <line [attr.x1]="tick.line.x1" [attr.y1]="tick.line.y1"
                  [attr.x2]="tick.line.x2" [attr.y2]="tick.line.y2"
                  [attr.stroke]="'#94a3b8'"
                  stroke-width="2" />

            <text [attr.x]="tick.label.x" [attr.y]="tick.label.y"
                  [attr.text-anchor]="tick.label.anchor"
                  [attr.fill]="'#94a3b8'"
                  [attr.font-weight]="'700'"
                  font-size="10">{{ tick.label.text }}</text>
          </g>
              }

          <!-- Generated Limit Ticks (Inner Percentages) -->
              @for (tick of limitTicks; track trackByLimitTick($index, tick)) {
              <g>
            <line [attr.x1]="tick.line.x1" [attr.y1]="tick.line.y1" 
                  [attr.x2]="tick.line.x2" [attr.y2]="tick.line.y2" 
                  class="center-zero-mark" 
                  [attr.stroke]="tick.pct === currentLimitPct ? limitColor : '#0ea5e9'"
                  stroke-width="2" />
            
            <text [attr.x]="tick.label.x" [attr.y]="tick.label.y" 
                  [attr.text-anchor]="tick.label.anchor"
                  [attr.fill]="tick.pct === currentLimitPct ? limitColor : '#0ea5e9'"
                  [attr.font-weight]="tick.pct === currentLimitPct ? '900' : '700'"
                  font-size="11"
                  class="scale-label">{{ tick.label.text }}</text>
          </g>
              }

              <!-- Limit Zone (Red Stripe for Restricted Area) -->
              <!-- Drawn after ticks to guarantee top-layer visibility during debugging. -->
              <path d="M 180 100 A 80 80 0 0 0 20 100"
                        class="limit-zone"
                        stroke-dasharray="251"
                        [attr.stroke-dashoffset]="limitZoneOffset"
                        [attr.stroke]="limitColor"
                        [attr.opacity]="currentLimitPct > -1 && currentLimitPct < 100 ? 1 : 0" />

          <!-- Limit Marker Line (Overlays the active arc) -->
          <line [attr.x1]="limitMarker.x1" [attr.y1]="limitMarker.y1"
                [attr.x2]="limitMarker.x2" [attr.y2]="limitMarker.y2"
                class="limit-line"
                stroke-width="2" 
                [attr.stroke]="limitColor" 
                [attr.opacity]="currentLimitPct > -1 ? 1 : 0" />

          <!-- Text Labels inside SVG for Perfect Scaling -->
          <!-- Primary Value (P) -->
          <text x="100" y="78" text-anchor="middle" class="svg-val-p" 
                [attr.fill]="!isOk ? badColor : productionColor">
                                          {{ displayValue }} <tspan class="svg-unit" font-size="0.6em" dy="0">{{ _unit }}</tspan>
          </text>

          <!-- Secondary Value (Q) -->
          <text x="100" y="98" text-anchor="middle" class="svg-val-q" 
                [attr.fill]="!isOk ? badColor : '#64748b'">
              Q: {{ displayQValue }} {{ _qUnit }}
          </text>

          <!-- Status Footer Background -->
          <rect x="0" y="118" width="200" height="25" rx="0"
                [attr.fill]="!isOk || isLimitUnknown ? '#f3f4f6' : (currentLimitPct > -1 && currentLimitPct < 100 ? '#fefce8' : '#dcfce7')" /> 

          <!-- Status Text -->
          <text x="100" y="135" text-anchor="middle" class="svg-status" 
                [attr.fill]="!isOk || isLimitUnknown ? badColor : (currentLimitPct > -1 && currentLimitPct < 100 ? '#854d0e' : '#15803d')">
              {{ statusText }}
          </text>
      </svg>
  </div>
</div>
