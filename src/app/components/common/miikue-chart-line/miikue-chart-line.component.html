<div class="tb-time-series-chart-panel">
  <div class="tb-time-series-chart-overlay"></div>
  <ng-container *ngIf="widgetComponent.dashboardWidget.showWidgetTitlePanel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </ng-container>
  <div class="tb-time-series-chart-controls">
    <div class="tb-data-mode-switcher">
      <button
        *ngFor="let mode of dataDisplayModes"
        type="button"
        class="tb-data-mode-switcher-btn"
        [class.active]="selectedDataDisplayMode === mode.value"
        (click)="onDataDisplayModeChange(mode.value)">
        {{ mode.label }}
      </button>
    </div>
  </div>
  <div class="tb-time-series-chart-content" [class]="legendClass">
    <div #echartContainer class="tb-time-series-chart-shape"></div>
    <div *ngIf="showLegend" class="tb-time-series-chart-legend tb-simple-legend">
      <div class="tb-time-series-chart-simple-legend-items">
        <ng-container *ngFor="let legendKey of legendKeys">
          <ng-container *ngTemplateOutlet="legendItem; context:{legendKey: legendKey, left: false}"></ng-container>
        </ng-container>
      </div>
    </div>
    <ng-template #legendItem let-legendKey="legendKey" let-left="left">
      <div class="tb-time-series-chart-legend-item"
           [class.left]="left">
        <div class="tb-time-series-chart-legend-item-label"
             [class.is-hidden]="isLegendSeriesHidden(legendKey)"
             (click)="toggleLegendSeries(legendKey)">
          <div class="tb-time-series-chart-legend-item-label-circle" [style]="{background: legendKey.dataKey.color}"></div>
          <div class="legend legend-label-color" [innerHTML]="legendKey.dataKey.label | safe: 'html'"></div>
        </div>
      </div>
    </ng-template>
  </div>
</div>
