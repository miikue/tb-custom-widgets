<div class="miikue-chart">
  <div class="miikue-chart__toolbar">
    <app-miikue-time-window-selector
      [initialTimeWindow]="selectedTimeWindow"
      (timeWindowChange)="onTimeWindowChange($event)">
    </app-miikue-time-window-selector>
    
    <div class="miikue-chart__aggregation-selector">
      <button
        *ngFor="let mode of aggregationModes"
        type="button"
        class="miikue-chart__aggregation-btn"
        [class.active]="selectedAggregationMode === mode.value"
        (click)="onAggregationModeChange(mode.value)">
        {{ mode.label }}
      </button>
    </div>

    <div class="miikue-chart__loading" *ngIf="isLoading">
      <span class="miikue-chart__loading-text">{{ loadingMessage }}</span>
      <div class="miikue-chart__loading-bar">
        <div class="miikue-chart__loading-bar-fill" [style.width.%]="loadingProgressPercent"></div>
      </div>
    </div>
  </div>

  <tb-miikue-chart-engine [ctx]="engineCtx"></tb-miikue-chart-engine>
</div>
