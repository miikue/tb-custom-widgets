<div *ngIf="isWidgetExpanded; else collapsedBlock" class="notifikation-wrapper expanded">
  <div class="expanded-header">
    <div class="title">Notification Center</div>
  </div>

  <div *ngIf="!isLoadingNotifications && notifications.length > 0" class="header-actions">
    <button 
      class="btn-action" 
      (click)="markAllAsRead()"
      [disabled]="isProcessingAction || unreadCount === 0"
      title="Označit všechny jako přečtené">
      ✓ Vše viděno
    </button>
    <button 
      class="btn-action btn-danger" 
      (click)="deleteAllNotifications()"
      [disabled]="isProcessingAction"
      title="Smazat všechny notifikace">
      ✕ Smazat vše
    </button>
  </div>

  <div *ngIf="isLoadingNotifications" class="state-text">Načítám notifikace...</div>
  <div *ngIf="!isLoadingNotifications && notificationsError" class="state-text error">{{ notificationsError }}</div>
  <div *ngIf="!isLoadingNotifications && !notificationsError && notifications.length === 0" class="state-text">Žádné notifikace.</div>

  <div *ngIf="!isLoadingNotifications && !notificationsError && notifications.length > 0" class="list">
    <div *ngFor="let item of notifications; trackBy: trackById" class="item" [class.unread-item]="isSent(item)">
      <div class="item-top">
        <div class="subject">{{ item?.subject || 'Notifikace' }}</div>
        <div *ngIf="isSent(item)" class="unread-badge">● NEPOTVRZENO</div>
        <div class="time">{{ formatNotificationTime(item?.createdTime) }}</div>
      </div>
      <div class="text">{{ item?.text || '' }}</div>
      <div class="item-actions">
        <button *ngIf="isSent(item)" 
          class="btn-item-action" 
          (click)="markAsRead(item?.id?.id)"
          [disabled]="isProcessingAction || isItemProcessing(item?.id?.id)"
          title="Označit jako přečtené">
          ✓ Viděno
        </button>
        <button 
          class="btn-item-action btn-delete" 
          (click)="deleteNotification(item?.id?.id)"
          [disabled]="isProcessingAction || isItemProcessing(item?.id?.id)"
          title="Smazat notifikaci">
          ✕
        </button>
      </div>
    </div>
  </div>

  <div class="pagination">
    <button 
      class="btn-pagination" 
      [disabled]="!hasPrevPage" 
      (click)="prevPage()">
      ← Předchozí
    </button>
    <div class="page-info">
      Stránka {{ currentPage + 1 }} z {{ totalPages }}
    </div>
    <button 
      class="btn-pagination" 
      [disabled]="!hasNextPage" 
      (click)="nextPage()">
      Další →
    </button>
  </div>
</div>
<ng-template #collapsedBlock>
  <div class="notifikation-wrapper collapsed">
    <div class="collapsed-title">Notifikace {{ collapsedUnreadText }}</div>
  </div>
</ng-template>
