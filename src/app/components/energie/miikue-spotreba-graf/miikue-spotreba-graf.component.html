<div class="miikue-spotreba-graf">
  <div class="miikue-spotreba-graf__toolbar">
    <div class="miikue-spotreba-graf__toolbar-left">
      <app-miikue-time-window-selector
        [initialTimeWindow]="selectedTimeWindow"
        (timeWindowChange)="onTimeWindowChange($event)">
      </app-miikue-time-window-selector>

      <div class="miikue-spotreba-graf__aggregation-selector">
        <button
          *ngFor="let mode of aggregationModes"
          type="button"
          class="miikue-spotreba-graf__aggregation-btn"
          [class.active]="selectedAggregationMode === mode.value"
          (click)="onAggregationModeChange(mode.value)">
          {{ mode.label }}
        </button>
      </div>
    </div>

    <div class="miikue-spotreba-graf__toolbar-center">
      <div class="miikue-spotreba-graf__loading" *ngIf="isLoading">
        <span class="miikue-spotreba-graf__loading-text">{{ loadingMessage }}</span>
        <div class="miikue-spotreba-graf__loading-bar">
          <div class="miikue-spotreba-graf__loading-bar-fill" [style.width.%]="loadingProgressPercent"></div>
        </div>
      </div>
    </div>

    <div class="miikue-spotreba-graf__toolbar-right">
      <div class="miikue-spotreba-graf__action-selector">
        <button type="button" class="miikue-spotreba-graf__icon-btn" (click)="onZoomSelectToggle()" title="Zoom výběr" aria-label="Zoom výběr">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79L20 21.5 21.5 20l-6-6zM10 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
          </svg>
        </button>
        <button type="button" class="miikue-spotreba-graf__icon-btn" (click)="onZoomBack()" title="Zoom zpět" aria-label="Zoom zpět">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6 6 6 0 0 1-5.65-4H4.26A8 8 0 0 0 12 21a8 8 0 0 0 0-16z"/>
          </svg>
        </button>
        <button type="button" class="miikue-spotreba-graf__icon-btn" (click)="onZoomOutFull()" title="Zoom out full" aria-label="Zoom out full">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11h16v2H4v-2zm4-6h8v2H8V5zm0 12h8v2H8v-2z"/>
          </svg>
        </button>
        <button type="button" class="miikue-spotreba-graf__icon-btn" (click)="onSavePng()" title="Uložit PNG" aria-label="Uložit PNG">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20h14v-2H5v2zM12 2l-5.5 5.5 1.42 1.42L11 5.84V16h2V5.84l3.08 3.08 1.42-1.42L12 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <tb-miikue-spotreba-graf-engine [ctx]="engineCtx"></tb-miikue-spotreba-graf-engine>
</div>
